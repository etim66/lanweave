[package]
name = "lanweave"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "TUI for local file transfer over an authorized LAN session"
repository = "https://github.com/etim66/lanweave"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lanweave"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
base64 = "0.23"
bytes = "1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "1"
mdns-sd = { version = "0.20.3", default-features = false, features = ["async"] }
# RFC 9382 SPAKE2-P256-SHA256-HKDF-HMAC prototype adapter. The package is
# unaudited; docs/CRYPTOGRAPHY.md keeps the release gate open.
pakery-core = "0.3"
pakery-crypto = { version = "0.3", default-features = false, features = ["p256", "spake2", "std"] }
pakery-spake2 = "0.3"
rand_core = { version = "0.9", features = ["os_rng"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zeroize = "1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Compiles the `fuzzing` shim that exposes the wire codecs to fuzz targets.
fuzz = []

[dev-dependencies]
# Exposes deterministic scalar constructors for RFC 9382 test vectors only.
pakery-spake2 = { version = "0.3", features = ["test-utils"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
