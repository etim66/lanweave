[package]
name = "lanweave"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "TUI for local file transfer over an authorized LAN session"
repository = "https://github.com/etim66/lanweave"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lanweave"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
mdns-sd = { version = "0.20.3", default-features = false, features = ["async"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[features]
# Compiles the `fuzzing` shim that exposes the wire codecs to fuzz targets.
fuzz = []
