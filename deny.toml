# cargo-deny configuration for Lanweave.
#
# Policy is strict from the first review. No temporary exception blocks. If a
# transitive dependency surfaces a copyleft license, the fix is to swap the
# offending crate, not to relax this file. See docs/IMPLEMENTATION_ROADMAP.md.

[graph]
all-features = false

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    # Permissive license used by Ratatui's transitive foldhash dependency.
    "Zlib",
    # Permissive license used by the rustls TLS stack (rustls-webpki, untrusted).
    "ISC",
    # Permissive license used by the subtle constant-time primitive library.
    "BSD-3-Clause",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
ignore = []
yanked = "warn"
